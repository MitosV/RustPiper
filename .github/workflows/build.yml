name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # espeak-ng languages embedded in the executable. `all` includes every one of
  # them (~8 MB extra); a comma-separated list embeds only those dictionaries.
  MCPIPER_ESPEAK_LANGS: es,en

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: mcpiper-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: cmake --version
        # `cmake` and libclang (via Xcode) already ship in the macOS image.

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV
          # We build natively, without --target: with --target cargo splits the
          # host and target units and espeak-ng is built twice (the build
          # dependency that orders the build is a host unit). The runner's triple
          # is already the one we want; verify it.
          rustc -vV | grep -qx 'host: ${{ matrix.target }}' \
            || { echo "the runner is not ${{ matrix.target }}"; rustc -vV; exit 1; }

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-
        # `matrix.target` here is only the cache key and the artifact name; it is
        # no longer passed to cargo.

      - name: Tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Self-test
        shell: bash
        run: |
          BIN=target/release/mcpiper
          "$BIN" --version
          "$BIN" --self-test

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/mcpiper dist/
          cp README.md USAGE.md LICENSE NOTICE.md dist/
          tar -czf "${{ matrix.asset }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  # The .exe is built in its own workflow, which can also be triggered on its own
  # from the Actions tab without dragging macOS along.
  windows:
    name: windows
    uses: ./.github/workflows/windows.yml
    with:
      langs: es,en
      smoke_test: true

  release:
    name: Publish release
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" \
            --title "mcpiper ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
