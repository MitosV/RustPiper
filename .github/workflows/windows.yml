name: windows

# Builds `mcpiper.exe` for x86_64-pc-windows-msvc.
#
# It can be triggered by hand from the Actions tab, and `build.yml` also calls it
# as part of the full matrix, so the .exe is built once per run and serves both
# for a standalone download and for the release.

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "espeak-ng languages to embed: a comma-separated list, or `all`"
        type: string
        default: es,en
      smoke_test:
        description: "Download a real voice and synthesize, to exercise ONNX Runtime end to end"
        type: boolean
        default: true
  workflow_call:
    inputs:
      langs:
        type: string
        default: es,en
      smoke_test:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ASSET: mcpiper-windows-x86_64
  # Deliberately short: espeak-ng's CMake tree nests deeply, and with the default
  # `target/` the build paths brush against the 260-character limit.
  CARGO_TARGET_DIR: C:\mp

jobs:
  build:
    name: mcpiper.exe (x86_64-pc-windows-msvc)
    # When GitHub retires this image, `windows-2025` is the drop-in replacement:
    # same VS 2022 toolset, same LLVM, same cmake.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      MCPIPER_ESPEAK_LANGS: ${{ inputs.langs }}

    steps:
      - uses: actions/checkout@v4

      - name: Enable long paths
        # Belt as well as braces: a short CARGO_TARGET_DIR is already enough, but
        # if some step of the espeak-ng build still builds a long path, this keeps
        # the classic "filename too long" away. Best-effort.
        run: |
          git config --global core.longpaths true
          try {
            New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
              -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
          } catch {
            Write-Host "::warning::could not enable LongPathsEnabled: $_"
          }

      - name: Build dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # bindgen needs libclang.dll to generate the espeak-ng bindings.
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # cmake already ships in the image; print it to leave it in the log.
          cmake --version

      - name: Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV
          # We build natively (no --target) so espeak-ng is not built twice: with
          # --target, cargo splits host from target and the build dependency that
          # orders the build compiles separately. The runner's triple is already
          # the one we want, but verifying beats assuming.
          $host_triple = (rustc -vV | Select-String '^host: ').Line -replace '^host: '
          if ($host_triple -ne 'x86_64-pc-windows-msvc') {
            throw "the runner is not x86_64-pc-windows-msvc but $host_triple"
          }

      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          # The registry only. This project's `target/` carries a static ONNX
          # Runtime and espeak-ng's whole CMake tree: several GB, and uploading
          # and downloading them costs more than they save.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --release --locked

      - name: Build
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked

      - name: Self-test
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = "${env:CARGO_TARGET_DIR}\release\mcpiper.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          "EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe --version
          & $exe --self-test
          "size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - name: DLLs the executable needs
        # Informational: confirms the only dynamic pieces are Microsoft's CRT
        # (VC++ Redistributable) plus Windows' own DLLs.
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1).FullName
          & $dumpbin /nologo /dependents ${env:EXE}

      - name: Smoke test with a real voice
        if: inputs.smoke_test != false
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # es_MX-ald-x_low is the lightest voice in the repository (~21 MB).
          $b = "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/ald/x_low"
          New-Item -ItemType Directory -Force -Path voice | Out-Null
          curl.exe -sSLf -o voice/probe.onnx      "$b/es_MX-ald-x_low.onnx"
          curl.exe -sSLf -o voice/probe.onnx.json "$b/es_MX-ald-x_low.onnx.json"

          & $env:EXE --model voice/probe --list-speakers
          & $env:EXE --model voice/probe --text "Hola. Esto lo dijo la integracion continua." --output out.ogg
          & $env:EXE --model voice/probe --text "Y esto salio en WAV." --output out.wav

          $ogg = [System.IO.File]::ReadAllBytes("out.ogg")
          if ($ogg.Length -lt 4000) {
            throw "the .ogg came out suspiciously small: $($ogg.Length) bytes"
          }
          if ([System.Text.Encoding]::ASCII.GetString([byte[]]$ogg[0..3]) -ne "OggS") {
            throw "the .ogg does not start with the OggS signature"
          }
          "ogg: $($ogg.Length) bytes / wav: $((Get-Item out.wav).Length) bytes"

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $env:EXE dist/
          Copy-Item README.md, USAGE.md, LICENSE, NOTICE.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${env:ASSET}.zip" -Force
          Get-ChildItem "${env:ASSET}.zip" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.zip
          if-no-files-found: error
